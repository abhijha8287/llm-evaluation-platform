services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_eval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 10. `profiles: ["full"]` — these three don't start on a bare
  # `docker compose up`, keeping Phase 5-9's native-dev loop (uvicorn
  # --reload / celery -A / npm run dev, all faster to iterate on than a
  # container rebuild) as the default. `docker compose --profile full up
  # --build` brings up the entire stack in containers instead — the
  # deployment-ready, production-like mode this phase adds.
  api:
    build: .
    profiles: ["full"]
    env_file:
      # required: false — a fresh clone has no .env until you `cp
      # .env.example .env` and fill in real keys (see README); the compose
      # file itself must still be valid without one.
      - path: .env
        required: false
    environment:
      # Overrides .env's localhost values — inside the compose network,
      # postgres/redis are reachable by service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llm_eval
      REDIS_URL: redis://redis:6379/0
    # Migrations run here, not in a separate init container — alembic
    # upgrade is idempotent (safe to run on every start) and this is a
    # single-instance demo deployment, not a multi-replica production
    # cluster where concurrent migration races would be a real concern.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    profiles: ["full"]
    env_file:
      # required: false — a fresh clone has no .env until you `cp
      # .env.example .env` and fill in real keys (see README); the compose
      # file itself must still be valid without one.
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/llm_eval
      REDIS_URL: redis://redis:6379/0
    # --concurrency=1, not the prefork default — see app/monitoring/
    # metrics.py's module docstring: this app's Prometheus instrumentation
    # assumes one worker process per container (one prometheus_client
    # registry, one /metrics port). Linux, so no --pool=solo Windows
    # workaround needed here — just capped concurrency.
    command: celery -A app.workers.celery_app worker --concurrency=1 --loglevel=info
    ports:
      - "9808:9808"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    profiles: ["full"]
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Phase 9 (monitoring). Scrapes FastAPI/Celery via host.docker.internal —
  # works unchanged whether they're running natively (default profile) or
  # containerized (`--profile full`), since the api/celery-worker services
  # above also publish their ports to the host — see monitoring/
  # prometheus.yml's comment.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      # 3000 is the Next.js dev server's port (see frontend's CORS note in
      # app/main.py) — Grafana uses 3001 on the host to avoid colliding.
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      # Anonymous viewer access — this is a local/portfolio demo dashboard,
      # not a multi-tenant deployment; D10's "single seeded user" posture
      # extends here too rather than adding a second auth system to manage.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
