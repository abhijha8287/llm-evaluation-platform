services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_eval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# Celery workers (Constraints: Linux container even on Windows dev — Celery's
# multiprocessing pool is unreliable on native Windows), the FastAPI app, and
# the Next.js frontend are containerized in Phase 9's Docker Compose
# finalization — see design doc Next Steps. Phase 5-8 run them locally
# (uvicorn --reload / celery -A / npm run dev) against these two services.

volumes:
  postgres_data:
